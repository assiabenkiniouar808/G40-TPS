<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Connexion</title>
</head>
<body>

<h1>Connexion</h1>

<form method="post">
    {% csrf_token %}

    <label>Login :</label>
    <input type="text" name="login"><br><br>

    <label>Mot de passe :</label>
    <input type="password" name="password"><br><br>

    <button type="submit">Connexion</button>
    <button type="reset">Annuler</button>
</form>

</body>
</html>
